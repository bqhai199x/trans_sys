name: Translator and optional Codex plugin

on:
  push:
    paths: ["translator/**", "plugins/translator-codex-cli/**", "filehandler/**", ".github/workflows/translator.yml"]
  pull_request:
    paths: ["translator/**", "plugins/translator-codex-cli/**", "filehandler/**", ".github/workflows/translator.yml"]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: filehandler/global.json
      - run: dotnet build filehandler/src/FileHandler.Api/FileHandler.Api.csproj -p:GenerateDocumentationFile=true
      - run: python -m pip install -r translator/requirements.lock ./translator
      - run: python -m unittest discover -s translator/tests -v
  plugin:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/translator-codex-cli/gateway/package-lock.json
      - run: python -m pip install -r translator/requirements.lock ./translator ./plugins/translator-codex-cli
      - run: python -m unittest discover -s plugins/translator-codex-cli/tests -v
      - run: npm ci
        working-directory: plugins/translator-codex-cli/gateway
      - run: npm test
        working-directory: plugins/translator-codex-cli/gateway
