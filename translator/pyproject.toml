[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trans-sys-translator"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1", "pydantic>=2.11,<3", "httpx>=0.28,<1", "google-genai==1.75.0", "python-multipart>=0.0.22,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
translation_service = ["swagger_fields.js"]
